# Security headers for Skyline Holding.
#
# nginx does NOT inherit add_header from the server block into a location that
# defines its own add_header, so this file is `include`d in every location that
# sets Cache-Control. Keep it as the single place to change these headers.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy, written for what the site actually loads:
#   scripts   : own bundle only. The one inline handler in index.html
#               (onload="this.media='all'", the non-blocking font loader) is
#               allowed by hash, not by 'unsafe-inline'.
#   styles    : own CSS + inline style attributes + Google Fonts CSS
#   fonts     : Google Fonts files
#   images    : own files + Unsplash + marbholding.com (approved remote images)
#   connect   : own origin only (the /api OTP endpoints are same-origin)
# If you add a new third-party (analytics, chat widget, another image host...)
# add it here, or the browser will block it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://marbholding.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# HSTS: enable ONLY after HTTPS works on the final domain (see DEPLOYMENT.md).
# Browsers remember it, so turning it on while HTTPS is broken locks visitors out.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
