# Skyline Holding - Nginx site configuration
#
#   Internet -> Nginx :80 (:443 after Certbot)
#                 |-- /api/*  -> Node/Express API on 127.0.0.1:8080 (PM2)
#                 `-- /*      -> static React build (SPA fallback to index.html)
#
# Install:
#   sudo cp deployment/nginx/skyline.conf /etc/nginx/sites-available/skyline
#   sudo cp deployment/nginx/snippets/skyline-security-headers.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/skyline /etc/nginx/sites-enabled/skyline
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Values you may need to change are marked  <-- CHANGE.

# Rate limit for the OTP endpoints, in addition to the limits inside the API
# (5 sends / email / hour, 20 / IP / hour, 5 attempts / code). Nginx rejects
# floods before they ever reach Node.
limit_req_zone $binary_remote_addr zone=skyline_otp:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Initially the server IP. When the domain is ready, replace with e.g.
    #   server_name yourdomain.com www.yourdomain.com;
    # and run Certbot (see DEPLOYMENT.md).
    server_name 2.25.169.72;                                   # <-- CHANGE (final domain)

    server_tokens off;

    # Built React app (created by scripts/deploy.sh).
    root /var/www/skyline-holding/artifacts/mockup-sandbox/dist;   # <-- CHANGE if you deploy elsewhere
    index index.html;

    # Nothing here legitimately needs a large request body (the OTP API accepts
    # small JSON only).
    client_max_body_size 20k;

    # ---- Compression -------------------------------------------------------
    # Text formats only. Images/PDFs are already compressed. (Brotli needs an
    # extra nginx module, so gzip is used.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # ---- Never serve dotfiles (.env, .git, ...) ----------------------------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---- API (Node/Express on localhost, managed by PM2) -------------------
    # OTP / auth responses must never be cached anywhere.
    location /api/ {
        limit_req zone=skyline_otp burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;                         # <-- CHANGE if PORT differs
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr (not $proxy_add_x_forwarded_for): a client-supplied
        # X-Forwarded-For must not be able to spoof its IP past the API's
        # per-IP rate limits. The API trusts exactly one proxy hop.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # No WebSocket upgrade: the site does not use WebSockets.

        add_header Cache-Control "no-store" always;
        include snippets/skyline-security-headers.conf;
    }

    # Lightweight health check -> the API's /api/healthz ({"status":"ok"}).
    location = /api/health {
        proxy_pass http://127.0.0.1:8080/api/healthz;             # <-- CHANGE if PORT differs
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
        include snippets/skyline-security-headers.conf;
    }

    # ---- Static assets -----------------------------------------------------
    # NOTE: Cache-Control here deliberately has NO `always`, so it is only sent on
    # successful responses. A 404 (e.g. a missing file mid-deploy) must never be
    # cached by browsers. Only the API `no-store` is sent on errors too.
    # Vite output in /assets/ has a content hash in the file name, so it can be
    # cached "forever"; a new build produces new names.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/skyline-security-headers.conf;
    }

    # Logo, favicon, team photos, hero images. Not content-hashed, so 30 days
    # (a replaced file appears within that window; rename it to force a refresh).
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/skyline-security-headers.conf;
    }

    # PDFs (company registry, ...): a shorter cache so an updated document
    # goes live quickly.
    location /documents/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include snippets/skyline-security-headers.conf;
    }

    # Favicons: real files at the standard locations (Google and browsers request
    # /favicon.ico directly). Small files, so a day is enough for the root ones and
    # a month for /icons/.
    location = /favicon.ico {
        try_files /favicon.ico =404;
        add_header Cache-Control "public, max-age=86400";
        include snippets/skyline-security-headers.conf;
    }

    location = /apple-touch-icon.png {
        try_files /apple-touch-icon.png =404;
        add_header Cache-Control "public, max-age=86400";
        include snippets/skyline-security-headers.conf;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/skyline-security-headers.conf;
    }

    # The Replit component-preview canvas (/preview/*) is a development tool and
    # must not exist in production. The app also refuses to render it in a
    # production build; this returns a real HTTP 404 before it gets that far.
    location ^~ /preview/ {
        return 404;
    }

    # The old /leadership page is now /team: permanent redirect for old links,
    # bookmarks and search engines.
    location ~ ^/leadership/?$ {
        return 301 /team;
    }

    # ---- Single-page app ---------------------------------------------------
    # Routes such as /about or /investment-strategy exist only in the browser,
    # so any path that is not a real file falls back to index.html. HTML is
    # always revalidated so visitors pick up a new deploy immediately.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include snippets/skyline-security-headers.conf;
    }
}
